name: Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install bun
        uses: oven-sh/setup-bun@v2.2.0
      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test

  e2e-test:
    # Hurl 4 requires libxml2, which Ubuntu 26.04 no longer provides.
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install bun
        uses: oven-sh/setup-bun@v2.2.0
      - name: Install dependencies
        run: bun install

      - name: Install wait-on
        run: bun add -g wait-on

      - name: Install Hurl
        run: |
          curl --fail --location --remote-name https://github.com/Orange-OpenSource/hurl/releases/download/4.0.0/hurl_4.0.0_amd64.deb
          sudo apt-get update
          sudo apt-get install -y ./hurl_4.0.0_amd64.deb

      - name: Integration test
        run: |
          PORT=8888 TRANSPORTER=TCP bun run start &
          # Health can pass before the gateway generates REST aliases.
          wait-on http://127.0.0.1:8888/api/health/check http-get://127.0.0.1:8888/api/api/list-aliases -l -i 500 -d 1000 -t 60000
          deadline=$((SECONDS + 60))
          until curl --fail --silent --max-time 2 http://127.0.0.1:8888/api/api/list-aliases | jq --exit-status 'any(.[]; .fullPath == "/api/product/cart" and .methods == "POST")' > /dev/null; do
            if (( SECONDS >= deadline )); then
              echo "Timed out waiting for POST /api/product/cart" >&2
              exit 1
            fi
            sleep 0.5
          done
          hurl --variable PORT=8888 --test test/e2e/*.hurl
