name: 🚀 Deploy
on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    name: ⬣ Linter
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7.0.1

      - name: ⎔ Setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0

      - name: 📥 Install pnpm
        run: npm install -g pnpm

      - name: 📥 Download deps
        run: pnpm install

      - name: 🔬 Lint
        run: pnpm run lint

  typecheck:
    name: ʦ TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7.0.1

      - name: ⎔ Setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0

      - name: 📥 Install pnpm
        run: npm install -g pnpm

      - name: 📥 Download deps
        run: pnpm install

      - name: 🔎 Type check
        run: pnpm run typecheck

  test:
    name: ⚡ Vitest
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7.0.1

      - name: ⎔ Setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0

      - name: 📥 Install pnpm
        run: npm install -g pnpm

      - name: 📥 Download deps
        run: pnpm install

      - name: ⚡ Run vitest
        run: pnpm run test

  build:
    name: 🐳 Build
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7.0.1

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: 🐳 Docker build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: moleculer-smoke:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check production container
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          trap 'docker logs moleculer-smoke; docker rm -f moleculer-smoke' EXIT
          docker run -d --name moleculer-smoke -p 127.0.0.1:8888:8888 -e GIT_REV="$EXPECTED_REVISION" moleculer-smoke:ci
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 2 -D "$RUNNER_TEMP/health-headers" http://127.0.0.1:8888/api/health/check
          actual=$(awk 'tolower($1) == "x-revision:" {gsub("\r", "", $2); print $2}' "$RUNNER_TEMP/health-headers" | tail -n 1)
          test "$actual" = "$EXPECTED_REVISION"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 2 http://127.0.0.1:8888/api/greeter/hello

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    concurrency:
      group: dokku-production
      cancel-in-progress: false

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: 🚀 Deploy to Dokku
        shell: bash
        env:
          DOKKU_SSH_PRIVATE_KEY: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
        run: |
          set -o pipefail # a failing git push must fail the step even though its output is piped into tee
          test -n "$DOKKU_SSH_PRIVATE_KEY" || { echo "Missing DOKKU_SSH_PRIVATE_KEY" >&2; exit 1; }
          umask 077
          key="$RUNNER_TEMP/dokku_key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$DOKKU_SSH_PRIVATE_KEY" > "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$GITHUB_WORKSPACE/.github/dokku_known_hosts"
          ssh_options=(-i "$key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/.github/dokku_known_hosts")

          # The app.json healthchecks are only honoured by Dokku 0.31.0 and newer.
          version_output=$(ssh "${ssh_options[@]}" dokku@95.111.232.131 version)
          dokku_version=${version_output##* }
          if [[ ! "$dokku_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Could not determine the Dokku version from <%s>\n' "$version_output" >&2
            exit 1
          fi
          dokku_major=${dokku_version%%.*}
          dokku_minor=${dokku_version#*.}
          dokku_minor=${dokku_minor%%.*}
          if [ "$dokku_major" -eq 0 ] && [ "$dokku_minor" -lt 31 ]; then
            printf 'Dokku 0.31.0 or newer is required for the app.json healthchecks, found <%s>\n' "$dokku_version" >&2
            exit 1
          fi

          # This target has deploy-branch=main set per-app on Dokku 0.37.7.
          # git:report prints the app property or the literal default "master", so
          # "master" means "unset" and the global property decides the effective branch.
          branch=$(ssh "${ssh_options[@]}" dokku@95.111.232.131 git:report moleculer --git-deploy-branch)
          if [ "$branch" = master ]; then
            branch=$(ssh "${ssh_options[@]}" dokku@95.111.232.131 git:report moleculer --git-global-deploy-branch)
          fi
          branch=${branch:-master}
          if [ "$branch" != main ]; then
            printf 'Expected Dokku deploy branch main, got <%s>\n' "$branch" >&2
            exit 1
          fi
          if ! git push ssh://dokku@95.111.232.131/moleculer HEAD:main 2>&1 | tee "$RUNNER_TEMP/dokku-push.log"; then
            printf 'Dokku git push failed, see %s\n' "$RUNNER_TEMP/dokku-push.log" >&2
            exit 1
          fi

      - name: Check public health
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 -D "$RUNNER_TEMP/health-headers" https://moleculer.itman.fyi/api/health/check
          actual=$(awk 'tolower($1) == "x-revision:" {gsub("\r", "", $2); print $2}' "$RUNNER_TEMP/health-headers" | tail -n 1)
          test "$actual" = "$EXPECTED_REVISION"
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 https://moleculer.itman.fyi/api/greeter/hello
