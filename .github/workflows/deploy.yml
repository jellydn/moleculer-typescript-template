name: 🚀 Deploy
on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    name: ⬣ Linter
    runs-on: ubuntu-latest
    steps:
      - name: 🛑 Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1

      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7.0.1

      - name: ⎔ Setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.4

      - name: 📥 Install pnpm
        run: npm install -g pnpm

      - name: 📥 Download deps
        run: pnpm install

      - name: 🔬 Lint
        run: pnpm run lint

  typecheck:
    name: ʦ TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: 🛑 Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1

      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7.0.1

      - name: ⎔ Setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.4

      - name: 📥 Install pnpm
        run: npm install -g pnpm

      - name: 📥 Download deps
        run: pnpm install

      - name: 🔎 Type check
        run: pnpm run typecheck

  test:
    name: ⚡ Vitest
    runs-on: ubuntu-latest
    steps:
      - name: 🛑 Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1

      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7.0.1

      - name: ⎔ Setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.4

      - name: 📥 Install pnpm
        run: npm install -g pnpm

      - name: 📥 Download deps
        run: pnpm install

      - name: ⚡ Run vitest
        run: pnpm run test

  build:
    name: 🐳 Build
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7.0.1

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: 🐳 Docker build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    concurrency:
      group: dokku-production
      cancel-in-progress: false

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: 🚀 Deploy to Dokku
        env:
          DOKKU_SSH_PRIVATE_KEY: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
        run: |
          test -n "$DOKKU_SSH_PRIVATE_KEY" || { echo "Missing DOKKU_SSH_PRIVATE_KEY" >&2; exit 1; }
          umask 077
          key="$RUNNER_TEMP/dokku_key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$DOKKU_SSH_PRIVATE_KEY" > "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$GITHUB_WORKSPACE/.github/dokku_known_hosts"
          git push ssh://dokku@95.111.232.131/moleculer HEAD:main

      - name: Check public health
        run: |
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 https://moleculer.itman.fyi/api/health/check
          curl --fail --silent --show-error https://moleculer.itman.fyi/api/greeter/hello
