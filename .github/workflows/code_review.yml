name: reviewdog

on:
  pull_request:

jobs:
  review:
    name: runner / Biome
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: pnpm/action-setup@v3.0.0
        name: Install pnpm
        with:
          version: 10.34.5
          run_install: true
      - uses: mongolyy/reviewdog-action-biome@v2.11.2
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
  misspell:
    name: runner / Misspell
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6.1.0
      - name: misspell
        uses: reviewdog/action-misspell@v1.27.0
        with:
          github_token: ${{ secrets.github_token }}
          locale: "US"
